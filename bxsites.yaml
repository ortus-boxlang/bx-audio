name: "BoxLang Audio"
description: "Make, mix, master and speak audio from BoxLang. Synthesis, loudness, time stretch, text to speech with captions, FFmpeg for video and a real time mixer for games, all on the JVM."
baseURL: "https://bxaudio.boxlang.io/"
source: docs
ogImage: "assets/og-image.png"
theme:
    name: bootstrap
    options:
        {
            colorMode: dark,
            navCollapsible: true,
            navExpandAll: false,
            tocPosition: sticky,
            accentColor: "#00C853",
            accentColorDark: "#34D399",
        }
    logo: "assets/boxlang-icon-full.svg"
    favicon: "assets/favicon.png"
search: true
nav: []
markdown:
    enableFootnotes: true
    enableDefinitionLists: true
repo:
