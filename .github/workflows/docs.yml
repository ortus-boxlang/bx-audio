name: Publish Docs

# Builds the documentation site (docs/ + bxsites.yaml, see readme.md) with BX Sites and publishes it to GitHub Pages at
# https://bxaudio.boxlang.io
#
# One time setup in the repository (Settings, Pages):
#   - Source: "Deploy from a branch", branch gh-pages, folder / (root), the same as bx-lens
#   - Custom domain: bxaudio.boxlang.io  (and "Enforce HTTPS" once the certificate is ready)
# and in DNS for boxlang.io: a CNAME record  bxaudio  ->  ortus-boxlang.github.io

on:
  push:
    branches:
      - development
    paths:
      - "docs/**"
      - "bxsites.yaml"
      - ".github/workflows/docs.yml"
  # Manual trigger
  workflow_dispatch:

# Only one publish at a time; a newer push replaces a queued one
concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  publish:
    name: Build & Publish Docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup BoxLang and bxSites
        uses: ortus-boxlang/setup-boxlang@main
        with:
          version: latest
          modules: bx-sites bx-markdown bx-esapi bx-yaml bx-image

      # Lint issues, broken links or missing alt text fail the publish
      - name: Build and Check Docs
        run: |
          export PATH="$HOME/.boxlang/bin:$PATH"
          bxSites -v
          bxSites lint
          bxSites build
          test -s site/index.html
          test -s site/404.html
          bxSites audit

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          cname: bxaudio.boxlang.io
          commit_message: "Docs: ${{ github.event.head_commit.message || 'manual publish' }}"
